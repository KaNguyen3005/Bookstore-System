# Application Configuration Template
# Copy this file to your actual application.yaml or application-dev.yaml and update the values

server:
  port: 8080
  tomcat:
    max-parameter-count: 1000
    max-part-count: 100
  servlet:
    context-path: /bookstore

cloudinary:
    cloud-name: "YOUR_CLOUDINARY_CLOUD_NAME"
    api-key: "YOUR_CLOUDINARY_API_KEY"
    api-secret: "YOUR_CLOUDINARY_API_SECRET"

spring:
  servlet:
    multipart:
      enabled: true
      location: /tmp/spring-uploads
      max-file-size: 50MB
      max-request-size: 100MB
  datasource:
    url: "jdbc:mysql://localhost:3306/db_bookstore?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh"
    username: root
    password: "YOUR_DATABASE_PASSWORD"
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

vnpay:
  tmn-code: "YOUR_VNPAY_TMN_CODE"         # Get from VNPay Merchant Admin
  hash-secret: "YOUR_VNPAY_SECRET_KEY"    # Get from VNPay Merchant Admin
  url: "https://sandbox.vnpayment.vn/paymentv2/vpcpay.html"
  return-url: "http://localhost:8080/bookstore/api/v1/payments/callback"

jwt:
  signerKey: "YOUR_JWT_SECRET_KEY"
  valid-duration: 3600 # in seconds
  refreshable-duration: 360000 # in seconds

