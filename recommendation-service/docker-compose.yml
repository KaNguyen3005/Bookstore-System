version: '3.8'

services:
  # Qdrant Vector Database
  qdrant:
    image: qdrant/qdrant:v2.7.0
    container_name: qdrant
    ports:
      - "6333:6333"
    environment:
      QDRANT_API_KEY: your_api_key_here
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - katila-network

  # KaTiLa AI Recommender Service
  recommender:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: katila-recommender
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: mysql+pymysql://katila_user:katila_pass@mysql:3306/katila_db
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      ENVIRONMENT: production
      DEBUG: "False"
      LOG_LEVEL: INFO
    depends_on:
      mysql:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    volumes:
      - ./app:/app/app
    networks:
      - katila-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: katila-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_USER: katila_user
      MYSQL_PASSWORD: katila_pass
      MYSQL_DATABASE: katila_db
      MYSQL_INITIALIZTION_FILES: /docker-entrypoint-initdb.d
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - katila-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  katila-network:
    driver: bridge

volumes:
  qdrant_storage:
    driver: local
  mysql_data:
    driver: local
